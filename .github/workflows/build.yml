name: Build and Test

on:
  push:
  pull_request:

jobs:
  linux-make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Unit tests
        run: make test
      - name: Demo run (smoke test)
        run: ./hms --demo

  cross-platform-cmake:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B out -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build out --config Release
      - name: Test
        run: ctest --test-dir out -C Release --output-on-failure
